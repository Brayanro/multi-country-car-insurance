packages:
  - frontend
  - backend
  - shared

allowBuilds:
  better-sqlite3: true
  esbuild: true
  sharp: true
  "@parcel/watcher": true
  "@swc/core": true
  core-js-pure: false
  lmdb: false
  msgpackr-extract: false

minimumReleaseAgeExclude:
  - "@pnpm/exe@11.29.0"
  - "@pnpm/linux-arm64@11.29.0"
  - "@pnpm/linux-x64@11.29.0"
  - "@pnpm/linuxstatic-x64@11.29.0"
  - "@pnpm/macos-arm64@11.29.0"
  - "@pnpm/win-arm64@11.29.0"
  - "@pnpm/win-x64@11.29.0"
