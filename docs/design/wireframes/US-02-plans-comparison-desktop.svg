<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc" xml:lang="en">
<title id="title">US-02 plan comparison — desktop</title>
<desc id="desc">Colombia comparison example. Esencial is checked. Ruta is recommended and unchecked. Both plans show a Colombian peso price, short description, coverage and benefits.</desc>
<g xml:lang="es">
<rect x="0" y="0" width="1200" height="820" rx="0" fill="#F5F7FC" stroke="none" stroke-width="1"/>
<g id="global-header">
<rect x="0" y="0" width="1200" height="76" rx="0" fill="#FFFFFF" stroke="none" stroke-width="1"/>
<path d="M0 75 L1200 75" stroke="#CCD8EE" stroke-width="1" stroke-linecap="round"/>
<path d="M69 25 L79 29 V36 Q79 45 69 50 Q59 45 59 36 V29 Z" stroke="#1748AF" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M64 37 L68 41 L75 33" stroke="#1748AF" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="92" y="46" fill="#15243B" font-family="Arial, sans-serif" font-size="19" font-weight="700" text-anchor="start">Seguro de auto</text>
</g>
<g id="wizard-progress">
<circle cx="391" cy="105" r="11" fill="#1748AF" stroke="#1748AF" stroke-width="1"/>
