<title id="title">Quote summary and payment concept — desktop</title><desc id="desc">Proposed later-story view. It shows the driver’s details with a masked RUT, vehicle, selected plan and local-currency total. Separate edit actions precede reading terms, consent and simulated payment; there are no card inputs.</desc>
