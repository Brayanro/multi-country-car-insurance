<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1082" viewBox="0 0 1200 1082" role="img" aria-labelledby="title desc" xml:lang="en">
<title id="title">US-03 Terms and payment states</title>
<desc id="desc">Six compact excerpts in reading order. Initial terms loading, terms unavailable with recovery, checking terms on Pay, changed terms requiring acceptance, simulated processing with Pay locked, and a rejection with the same Pay action available.</desc>
<rect x="0" y="0" width="1200" height="1082" rx="0" fill="#F5F7FC" stroke="none"/>
<text x="40" y="60" fill="#15243B" font-family="Georgia, serif" font-size="38" font-weight="400" text-anchor="start">Terms and payment states</text>
<text x="40" y="93" fill="#344763" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">Compact excerpts of the same Summary. The review and plan stay above these sections.</text>
<text x="40" y="136" fill="#15243B" font-family="Arial, sans-serif" font-size="16" font-weight="700" text-anchor="start">Reading terms</text>
<rect x="40" y="152" width="362" height="395" rx="8" fill="#FFFFFF" stroke="#CCD8EE"/>
<g xml:lang="es">
<text x="57" y="192" fill="#15243B" font-family="Georgia, serif" font-size="21" font-weight="400" text-anchor="start">Términos y condiciones</text>
<rect x="57" y="212" width="328" height="54" rx="6" fill="#F5F7FC" stroke="none"/>
<text x="69" y="245" fill="#344763" font-family="Arial, sans-serif" font-size="15" font-weight="700" text-anchor="start">Cargando términos…</text>
<rect x="57" y="464" width="328" height="48" rx="6" fill="#E0E7F4" stroke="none"/>
<text x="221.0" y="493.0" fill="#405575" font-family="Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle">Simular pago</text>
</g>
<text x="419" y="136" fill="#15243B" font-family="Arial, sans-serif" font-size="16" font-weight="700" text-anchor="start">Terms unavailable</text>
<rect x="419" y="152" width="362" height="395" rx="8" fill="#FFFFFF" stroke="#CCD8EE"/>
<g xml:lang="es">
<text x="436" y="192" fill="#15243B" font-family="Georgia, serif" font-size="21" font-weight="400" text-anchor="start">Términos y condiciones</text>
<rect x="436" y="212" width="328" height="54" rx="6" fill="#FFF2EF" stroke="none"/>
<text x="448" y="244" fill="#9E2F26" font-family="Arial, sans-serif" font-size="15" font-weight="700" text-anchor="start">No pudimos cargar los términos.</text>
<rect x="436" y="286" width="145" height="44" rx="6" fill="#FFFFFF" stroke="#586D91"/>
<text x="508.5" y="313.0" fill="#1748AF" font-family="Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle">Reintentar carga</text>
<rect x="436" y="464" width="328" height="48" rx="6" fill="#E0E7F4" stroke="none"/>
<text x="600.0" y="493.0" fill="#405575" font-family="Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle">Simular pago</text>
</g>
<text x="798" y="136" fill="#15243B" font-family="Arial, sans-serif" font-size="16" font-weight="700" text-anchor="start">Checking terms on Pay</text>
<rect x="798" y="152" width="362" height="395" rx="8" fill="#FFFFFF" stroke="#CCD8EE"/>
<g xml:lang="es">
<text x="815" y="192" fill="#15243B" font-family="Georgia, serif" font-size="21" font-weight="400" text-anchor="start">Pago simulado</text>
