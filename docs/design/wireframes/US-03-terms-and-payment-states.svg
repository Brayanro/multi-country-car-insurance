<text x="827" y="427" fill="#344763" font-family="Arial, sans-serif" font-size="15" font-weight="700" text-anchor="start">Comprobando los términos…</text>
<text x="815" y="247" fill="#15243B" font-family="Arial, sans-serif" font-size="16" font-weight="700" text-anchor="start">Resultado del pago (solo demostración)</text>
<text x="815" y="273" fill="#405575" font-family="Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start">No se realizará un cobro real.</text>
<circle cx="824" cy="312" r="9" fill="#FFFFFF" stroke="#1748AF"/>
<circle cx="824" cy="312" r="5" fill="#1748AF" stroke="none"/>
<text x="843" y="317" fill="#15243B" font-family="Arial, sans-serif" font-size="15" font-weight="700" text-anchor="start">Aprobado</text>
