<text x="40" y="597" fill="#15243B" font-family="Arial, sans-serif" font-size="16" font-weight="700" text-anchor="start">Terms changed on Pay</text>
<rect x="40" y="613" width="362" height="395" rx="8" fill="#FFFFFF" stroke="#CCD8EE"/>
<g xml:lang="es">
<text x="57" y="653" fill="#15243B" font-family="Georgia, serif" font-size="21" font-weight="400" text-anchor="start">Términos y condiciones</text>
<rect x="57" y="673" width="328" height="79" rx="6" fill="#EAF0FF" stroke="none"/>
<text x="69" y="705" fill="#1748AF" font-family="Arial, sans-serif" font-size="15" font-weight="700" text-anchor="start">Los términos cambiaron.</text>
<text x="69" y="730" fill="#1748AF" font-family="Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start">Léelos y acéptalos para continuar.</text>
<text x="57" y="785" fill="#344763" font-family="Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start">La cobertura se aplica al vehículo indicado</text>
<text x="57" y="809" fill="#344763" font-family="Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start">y está sujeta a los límites y exclusiones</text>
<text x="57" y="833" fill="#344763" font-family="Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start">del plan seleccionado.</text>
<rect x="57" y="844" width="18" height="18" rx="3" fill="#FFFFFF" stroke="#586D91"/>
<text x="87" y="859" fill="#15243B" font-family="Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start">Acepto los términos y condiciones</text>
<rect x="57" y="925" width="328" height="48" rx="6" fill="#E0E7F4" stroke="none"/>
<text x="221.0" y="954.0" fill="#405575" font-family="Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle">Simular pago</text>
</g>
<text x="419" y="597" fill="#15243B" font-family="Arial, sans-serif" font-size="16" font-weight="700" text-anchor="start">Processing</text>
<rect x="419" y="613" width="362" height="395" rx="8" fill="#FFFFFF" stroke="#CCD8EE"/>
<g xml:lang="es">
<text x="436" y="653" fill="#15243B" font-family="Georgia, serif" font-size="21" font-weight="400" text-anchor="start">Pago simulado</text>
<rect x="436" y="855" width="328" height="54" rx="6" fill="#F5F7FC" stroke="none"/>
<text x="448" y="888" fill="#344763" font-family="Arial, sans-serif" font-size="15" font-weight="700" text-anchor="start">Procesando el pago simulado…</text>
<text x="436" y="708" fill="#15243B" font-family="Arial, sans-serif" font-size="16" font-weight="700" text-anchor="start">Resultado del pago (solo demostración)</text>
<text x="436" y="734" fill="#405575" font-family="Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start">No se realizará un cobro real.</text>
<circle cx="445" cy="773" r="9" fill="#FFFFFF" stroke="#1748AF"/>
<circle cx="445" cy="773" r="5" fill="#1748AF" stroke="none"/>
<text x="464" y="778" fill="#15243B" font-family="Arial, sans-serif" font-size="15" font-weight="700" text-anchor="start">Aprobado</text>
<circle cx="570" cy="773" r="9" fill="#FFFFFF" stroke="#586D91"/>
<text x="589" y="778" fill="#15243B" font-family="Arial, sans-serif" font-size="15" font-weight="700" text-anchor="start">Rechazado</text>
<rect x="436" y="925" width="328" height="48" rx="6" fill="#E0E7F4" stroke="none"/>
<text x="600.0" y="954.0" fill="#405575" font-family="Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle">Simular pago</text>
</g>
<text x="798" y="597" fill="#15243B" font-family="Arial, sans-serif" font-size="16" font-weight="700" text-anchor="start">Rejected; ready to retry</text>
<rect x="798" y="613" width="362" height="395" rx="8" fill="#FFFFFF" stroke="#CCD8EE"/>
<g xml:lang="es">
<text x="815" y="653" fill="#15243B" font-family="Georgia, serif" font-size="21" font-weight="400" text-anchor="start">Pago simulado rechazado.</text>
<rect x="815" y="673" width="328" height="79" rx="6" fill="#FFF2EF" stroke="none"/>
<text x="827" y="705" fill="#9E2F26" font-family="Arial, sans-serif" font-size="15" font-weight="700" text-anchor="start">Tu cotización se conservó.</text>
<text x="827" y="730" fill="#9E2F26" font-family="Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start">Elige un resultado y vuelve a simular el pago.</text>
